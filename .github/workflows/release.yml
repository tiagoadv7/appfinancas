name: Finanças App — Release

# Dispara quando uma tag no formato v*.*.* é criada (ex: v3.1.4)
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build APK e criar Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout do código ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Configurar Java 17 (exigido pelo Gradle moderno) ───────────────
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Configurar Flutter ─────────────────────────────────────────────
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          # Mesma versão usada localmente — pubspec exige Dart >= 3.10
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      # ── 4. Instalar dependências ──────────────────────────────────────────
      - name: flutter pub get
        run: flutter pub get

      # ── 5. Restaurar google-services.json (Firebase) ─────────────────────
      #    Como salvar o secret:
      #      base64 android/app/google-services.json | tr -d '\n'
      #    Cole o resultado como secret GOOGLE_SERVICES_JSON em
      #    Settings → Secrets and variables → Actions → New repository secret.
      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON ausente."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_B64" | tr -d '\r\n ' | base64 --decode > android/app/google-services.json

      # ── 5a. Restaurar lib/firebase_options.dart (fora do Git) ─────────────
      #    Secret FIREBASE_OPTIONS_DART = base64 do arquivo.
      - name: Restaurar firebase_options.dart
        env:
          FIREBASE_OPTIONS_B64: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_B64" ]; then
            echo "::error::Secret FIREBASE_OPTIONS_DART ausente."
            exit 1
          fi
          printf '%s' "$FIREBASE_OPTIONS_B64" | tr -d '\r\n ' | base64 --decode > lib/firebase_options.dart

      # ── 5b. Mascarar chaves sensíveis do Firebase nos logs ────────────────
      - name: Mascarar chaves Firebase
        run: |
          # Extrai todos os valores de "current_key" e "api_key" do JSON
          # e registra cada um como valor mascarado no runner.
          # A partir daqui qualquer impressão dessas strings vira "***".
          for key in $(python3 - <<'EOF'
          import json, sys
          with open("android/app/google-services.json") as f:
              data = json.load(f)
          keys = set()
          def walk(obj):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if k in ("current_key", "value") and isinstance(v, str) and len(v) > 8:
                          keys.add(v)
                      walk(v)
              elif isinstance(obj, list):
                  for item in obj:
                      walk(item)
          walk(data)
          print('\n'.join(keys))
          EOF
          ); do
            echo "::add-mask::$key"
          done

      # ── 5c. Restaurar chave de assinatura fixa ────────────────────────────
      #    Todas as releases precisam da MESMA assinatura, senão o Android
      #    recusa instalar a atualização por cima. Secrets necessários:
      #      ANDROID_KEYSTORE_BASE64  (base64 do arquivo .jks)
      #      ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Restaurar keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 ausente — APK sairia com debug key aleatória e a atualização automática falharia."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # ── 6. Extrair versão da tag (remove o "v" inicial) ───────────────────
      - name: Extrair versão
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ── 7. Build APK release ──────────────────────────────────────────────
      #    versionName = versão da tag (é o que o app compara com a release)
      #    versionCode = nº da execução (sempre crescente; Android exige)
      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=$((100 + GITHUB_RUN_NUMBER))

      # ── 8. Renomear APK com versão ────────────────────────────────────────
      #    Nome do asset é o que o app usa (UpdateService) para achar o
      #    link de download direto na release mais recente do GitHub.
      - name: Renomear APK
        run: |
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -n 1)
          cp "$APK" "FinancasApp-${{ steps.version.outputs.version }}.apk"

      # ── 9. Criar GitHub Release e fazer upload do APK ─────────────────────
      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "Finanças App v${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            FinancasApp-${{ steps.version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
