name: Finanças App — Release

# Dispara quando uma tag no formato v*.*.* é criada (ex: v3.1.4)
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    name: Build APK e criar Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout do código ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Configurar Java 17 (exigido pelo Gradle moderno) ───────────────
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Configurar Flutter ─────────────────────────────────────────────
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      # ── 4. Instalar dependências ──────────────────────────────────────────
      - name: flutter pub get
        run: flutter pub get

      # ── 5. Restaurar google-services.json (Firebase) ─────────────────────
      #    Como salvar o secret:
      #      base64 android/app/google-services.json | tr -d '\n'
      #    Cole o resultado como secret GOOGLE_SERVICES_JSON em
      #    Settings → Secrets and variables → Actions → New repository secret.
      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_B64" | base64 --decode > android/app/google-services.json

      # ── 5b. Mascarar chaves sensíveis do Firebase nos logs ────────────────
      - name: Mascarar chaves Firebase
        run: |
          # Extrai todos os valores de "current_key" e "api_key" do JSON
          # e registra cada um como valor mascarado no runner.
          # A partir daqui qualquer impressão dessas strings vira "***".
          for key in $(python3 - <<'EOF'
          import json, sys
          with open("android/app/google-services.json") as f:
              data = json.load(f)
          keys = set()
          def walk(obj):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if k in ("current_key", "value") and isinstance(v, str) and len(v) > 8:
                          keys.add(v)
                      walk(v)
              elif isinstance(obj, list):
                  for item in obj:
                      walk(item)
          walk(data)
          print('\n'.join(keys))
          EOF
          ); do
            echo "::add-mask::$key"
          done

      # ── 6. Build APK release ──────────────────────────────────────────────
      - name: Build APK (release)
        run: flutter build apk --release

      # ── 7. Extrair versão da tag (remove o "v" inicial) ───────────────────
      - name: Extrair versão
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # ── 8. Renomear APK com versão ────────────────────────────────────────
      - name: Renomear APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             "financas-app-v${{ steps.version.outputs.version }}.apk"

      # ── 9. Criar GitHub Release e fazer upload do APK ─────────────────────
      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "Finanças App v${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            financas-app-v${{ steps.version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
