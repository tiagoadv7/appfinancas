<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="appfinancas">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon - load from assets/images/logo.svg (no parent path) and PNG fallback -->
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <title>Finanças</title>
  <link rel="manifest" href="manifest.json">

  <!--
    NOTA: NÃO inicialize o Firebase aqui via JS.
    O FlutterFire (firebase_core Dart) já inclui e inicializa o Firebase JS SDK
    internamente quando você chama Firebase.initializeApp() no código Dart.
    Ter duas inicializações (JS manual + Dart) causa conflito de versões e o erro:
      "FirebaseException is not a subtype of JavaScriptObject"
  -->
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
